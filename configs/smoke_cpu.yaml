# Lightweight config for CPU / quick smoke tests.

experiment_name: smoke_unet_resnet18
seed: 42

data:
  dataset_root: dataset
  index_csv: dataset/dataset_index.csv
  classes_config: configs/dataset_classes.yaml
  class_balance_json: reports/class_balance.json
  target_domain: clean_render
  train_kinds: [tile]
  val_kinds: [tile]
  test_kinds: [tile]
  image_size: 512
  num_workers: 0
  native_resolution: true

model:
  architecture: unet
  encoder_name: resnet18
  encoder_weights: imagenet
  in_channels: 3
  classes: 16

loss:
  ce_weight: 0.5
  dice_weight: 0.5
  lovasz_weight: 0.0
  class_weight_mode: effective_number
  effective_beta: 0.9999
  weight_clip_min: 0.25
  weight_clip_max: 10.0
  empty_class_weight: 0.0

train:
  epochs: 2
  batch_size: 2
  grad_accumulation: 1
  lr: 3.0e-4
  encoder_lr_factor: 0.1
  weight_decay: 1.0e-4
  warmup_epochs: 0
  scheduler: cosine
  amp: false
  ema: false
  early_stopping_patience: 5
  log_every: 10
  vis_every_epochs: 1
  checkpoint_dir: checkpoints
  runs_dir: runs
  resume: null

augment:
  horizontal_flip: 0.5
  vertical_flip: 0.5
  random_rotate90: 0.5
  shift_scale_rotate:
    p: 0.3
    shift_limit: 0.06
    scale_limit: 0.1
    rotate_limit: 15
  brightness_contrast:
    p: 0.2
    brightness_limit: 0.1
    contrast_limit: 0.1
  hue_saturation:
    p: 0.1
    hue_shift_limit: 5
    sat_shift_limit: 10
    val_shift_limit: 10
  blur:
    p: 0.3
    gaussian_limit: [3, 5]
    motion_limit: 5
  jpeg_compression:
    p: 0.2
    quality_range: [60, 95]

infer:
  window: 512
  step: 256
  blend: gaussian
  tta: false
  batch_size: 2

eval:
  exclude_background: true
  exclude_empty_classes: true
